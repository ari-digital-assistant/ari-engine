[package]
name = "ari-ffi"
version = "0.2.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]
name = "ari_ffi"

[features]
default = ["llm"]
llm = ["ari-engine/llm", "ari-runtime/llm", "dep:ari-llm"]

[dependencies]
ari-core = { path = "../ari-core" }
ari-engine = { path = "../ari-engine" }
ari-llm = { path = "../ari-llm", optional = true }
ari-runtime = { path = "../ari-runtime", default-features = false }
ari-skills = { path = "../ari-skills" }
ari-skill-loader = { path = "../ari-skill-loader" }
ari-voice = { path = "../ari-voice" }
serde_json = { workspace = true }
thiserror = "2.0.18"
uniffi = { workspace = true, features = ["cli"] }

# The JNI entry point for the microphone's audio (voice_pipeline.rs).
[target.'cfg(target_os = "android")'.dependencies]
jni-sys = "0.3"
