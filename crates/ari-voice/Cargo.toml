[package]
name = "ari-voice"
version = "0.1.0"
edition = "2024"
description = "The voice pipeline every frontend shares: wake word, speech-to-text and the rules around them"
license = "MIT"

[dependencies]
chrono = { workspace = true }
ari-native = { path = "../ari-native" }
regex = "1.12.3"
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
serde_json = { workspace = true }
sha2 = "0.11.0"
webpki-roots = "1.0"

[dev-dependencies]
tempfile = "3"
